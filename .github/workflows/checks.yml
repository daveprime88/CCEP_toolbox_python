name: Python checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv
      - run: uv pip install -e . --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync black --check .
      - run: uv run --no-sync pytest
  gui-imaging:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS: '1'
      MPLCONFIGDIR: /tmp/ccep-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: uv sync --locked --extra gui --extra imaging --group gui-tests
      - run: uv run --no-sync python tools/check.py
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv build
      - run: uv venv .wheel-test
      - run: uv pip install --python .wheel-test/bin/python dist/*.whl
      - run: .wheel-test/bin/ccep --json skill-path
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
